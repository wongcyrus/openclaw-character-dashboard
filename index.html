<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>%VITE_BANNER_TEXT%</title>
  
    <style>
    /* Cyberpunk Cognito Login Overlay Styles */
    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      position: absolute;
      top: 0; left: 0;
      z-index: 10000;
      padding: 20px;
      background: #05060a;
    }

    .login-card {
      background: rgba(10, 12, 22, 0.6);
      border: 1px solid rgba(0, 240, 255, 0.2);
      backdrop-filter: blur(20px);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(0, 240, 255, 0.03);
      width: 100%;
      max-width: 420px;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 3px;
      background: linear-gradient(90deg, #00f0ff, #bd00ff, #ff007a);
    }

    .login-header-text {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header-text h2 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #00f0ff, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.4;
      font-family: sans-serif;
    }

    .login-header-text p {
      color: rgba(240, 244, 258, 0.6);
      font-size: 13px;
      font-weight: 500;
      font-family: sans-serif;
    }

    .login-form-group {
      margin-bottom: 20px;
      font-family: sans-serif;
    }

    .login-form-group label {
      display: block;
      margin-bottom: 8px;
      color: #00f0ff;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .login-form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(5, 6, 10, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 8px;
      font-size: 14px;
      color: #f0f4fe;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .login-form-group input:focus {
      outline: none;
      border-color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.25), inset 0 0 10px rgba(0, 0, 0, 0.5);
      background: rgba(0, 240, 255, 0.02);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00f0ff 0%, #bd00ff 100%);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.2);
      margin-top: 10px;
    }

    .login-btn:hover {
      background: linear-gradient(135deg, #ffffff 0%, #00f0ff 100%);
      transform: translateY(-1.5px);
      box-shadow: 0 6px 20px rgba(0, 240, 255, 0.35);
    }

    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none;
    }

    .login-error {
      background: rgba(255, 0, 122, 0.1);
      color: #ff3b9a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 13px;
      border: 1px solid rgba(255, 0, 122, 0.25);
      line-height: 1.4;
      text-align: center;
      font-weight: 500;
      font-family: sans-serif;
    }
    
    .logout-btn-overlay {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255, 0, 122, 0.1);
      border: 1px solid rgba(255, 0, 122, 0.3);
      color: #ff3b9a;
      padding: 6px 12px;
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    </style>

  </head>
  <body>

  <!-- Login Screen Overlay -->
  <div id="login-wrapper" class="login-wrapper" style="display: none;">
    <div class="login-card">
      <div class="login-header-text">
        <h2>OpenClaw Character Dashboard</h2>
        <p>Secure Portal Login</p>
      </div>

      <div id="login-error" class="login-error"></div>

      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div class="login-form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter Cognito username" required autocomplete="username">
        </div>
        <div class="login-form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter Cognito password" required autocomplete="current-password">
        </div>
        <button type="submit" id="login-submit-btn" class="login-btn">Secure Login</button>
      </form>
    </div>
  </div>

    <div id="root" style="display: none;"></div>
    
  
    <script>
    // --- Cognito REST API Authentication Integration ---
    let cognitoConfig = {
      region: "%VITE_COGNITO_REGION%",
      clientId: "%VITE_COGNITO_CLIENT_ID%",
      userPoolId: "%VITE_COGNITO_USER_POOL_ID%"
    };

    let sessionGuardTimer = null;

    async function loadCognitoConfig() {
      try {
        const response = await fetch('/config.json');
        if (response.ok) {
          const config = await response.json();
          if (config.region) cognitoConfig.region = config.region;
          if (config.clientId) cognitoConfig.clientId = config.clientId;
          if (config.userPoolId) cognitoConfig.userPoolId = config.userPoolId;
        }
      } catch (err) {
        console.warn('Could not read config.json for Cognito configuration, using default region & client IDs.', err);
      }
    }

    function checkExistingAuth() {
      const accessToken = localStorage.getItem('accessToken');
      if (accessToken) {
        try {
          const payload = JSON.parse(atob(accessToken.split('.')[1]));
          const currentTime = Math.floor(Date.now() / 1000);
          if (payload.exp > currentTime) {
            return true;
          } else {
            localStorage.clear();
          }
        } catch (error) {
          localStorage.clear();
        }
      }
      return false;
    }

    function startSessionGuard() {
      if (sessionGuardTimer) clearInterval(sessionGuardTimer);
      sessionGuardTimer = setInterval(() => {
        if (!checkExistingAuth()) {
          console.warn("🔒 Secure Cognito token expired. Reloading to prevent unnecessary charges...");
          forceSessionLogout();
        }
      }, 30000); // Verify session validity every 30 seconds
    }

    function forceSessionLogout() {
      if (sessionGuardTimer) {
        clearInterval(sessionGuardTimer);
        sessionGuardTimer = null;
      }
      localStorage.clear();
      // Reloading entirely drops all react state and websockets.
      window.location.reload();
    }

    async function authenticateUser(username, password) {
      const response = await fetch(`https://cognito-idp.${cognitoConfig.region}.amazonaws.com/`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-amz-json-1.1',
          'X-Amz-Target': 'AWSCognitoIdentityProviderService.InitiateAuth'
        },
        body: JSON.stringify({
          AuthFlow: "USER_PASSWORD_AUTH",
          ClientId: cognitoConfig.clientId,
          AuthParameters: {
            USERNAME: username,
            PASSWORD: password
          }
        })
      });

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.message || 'Authentication failed');
      }

      const result = await response.json();
      const authResult = result.AuthenticationResult;

      localStorage.setItem('accessToken', authResult.AccessToken);
      localStorage.setItem('idToken', authResult.IdToken);
      localStorage.setItem('refreshToken', authResult.RefreshToken);

      return authResult;
    }

    function showLoginError(msg) {
      const errDiv = document.getElementById('login-error');
      if (errDiv) {
        errDiv.textContent = msg;
        errDiv.style.display = 'block';
      }
    }

    function hideLoginError() {
      const errDiv = document.getElementById('login-error');
      if (errDiv) {
        errDiv.style.display = 'none';
      }
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      hideLoginError();

      const btn = document.getElementById('login-submit-btn');
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Authenticating...";

      const userVal = document.getElementById('username').value.trim();
      const passVal = document.getElementById('password').value;

      try {
        await authenticateUser(userVal, passVal);
        document.getElementById('login-wrapper').style.display = 'none';
        document.getElementById('root').style.display = 'block';
        initializeApp(true);
      } catch (err) {
        console.error("Cognito login process failure:", err);
        let errorMsg = err.message || "Authentication failed. Please verify credentials.";
        if (errorMsg.includes("NotAuthorizedException")) {
          errorMsg = "Incorrect username or password.";
        }
        showLoginError(errorMsg);
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }
    
    function handleLogout() {
      forceSessionLogout();
    }

    async function initAuthFlow() {
      await loadCognitoConfig();

      // Check if Cognito is intentionally disabled or running in local dev without .env vars
      const isCognitoConfigured = cognitoConfig.clientId && 
                                  !cognitoConfig.clientId.includes('%VITE_') && 
                                  cognitoConfig.clientId.trim() !== '';

      if (!isCognitoConfigured) {
        console.log("🔓 Cognito client ID not set. Bypassing secure authentication for local execution.");
        document.getElementById('login-wrapper').style.display = 'none';
        document.getElementById('root').style.display = 'block';
        initializeApp(false); // pass flag to skip session guard
        return;
      }

      if (checkExistingAuth()) {
        document.getElementById('login-wrapper').style.display = 'none';
        document.getElementById('root').style.display = 'block';
        
        // Add logout button
        const logoutBtn = document.createElement('button');
        logoutBtn.className = 'logout-btn-overlay';
        logoutBtn.textContent = 'Log Out';
        logoutBtn.onclick = handleLogout;
        document.body.appendChild(logoutBtn);

        initializeApp(true);
      } else {
        document.getElementById('login-wrapper').style.display = 'flex';
        document.getElementById('root').style.display = 'none';
      }
    }

    function initializeApp(useSessionGuard = true) {
      if (useSessionGuard) {
        startSessionGuard();
      }
      const script = document.createElement('script');
      script.type = 'module';
      script.src = '/src/main.tsx';
      document.body.appendChild(script);
    }

    window.addEventListener('DOMContentLoaded', initAuthFlow);
    </script>

  </body>
</html>
